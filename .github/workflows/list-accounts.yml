name: List PostEverywhere accounts

on:
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Show connected accounts (id, platform, name, can post?)
        env:
          PE_API_KEY: ${{ secrets.PE_API_KEY }}
        run: |
          node -e '
          (async () => {
            const r = await fetch("https://app.posteverywhere.ai/api/v1/accounts", {headers: {Authorization: "Bearer " + process.env.PE_API_KEY}});
            const t = await r.text();
            if (!r.ok) { console.log("Error", r.status, t); process.exit(1); }
            const j = JSON.parse(t);
            const list = Array.isArray(j) ? j : (j.data || j.accounts || []);
            console.log("\n================ YOUR ACCOUNTS ================");
            for (const a of list) console.log(`ID ${a.id}  |  ${a.platform}  |  ${a.account_name}  |  active: ${a.is_active}  |  can post: ${a.health ? a.health.can_post : "?"}`);
            console.log("===============================================\n");
            if (!list.length) console.log("Raw response:", t.slice(0, 2000));
          })();'
